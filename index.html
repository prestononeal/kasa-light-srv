<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Christmas Lights</title>
<style>
  :root { color-scheme: dark; font: 16px system-ui, sans-serif; color: #fff7e9; background: #101c18; }
  body { margin: 0; background: radial-gradient(ellipse at top, #244638, transparent 38rem); min-height: 100vh; }
  main { max-width: 56rem; margin: auto; padding: clamp(1.25rem, 5vw, 4rem); }
  h1 { font: 500 clamp(2.75rem, 8vw, 5.25rem)/1 Georgia, serif; margin: 0 0 1rem; letter-spacing: -.055em; }
  h2 { margin: .5rem 0; font-size: 1.3rem; overflow-wrap: anywhere; }
  p { color: #c1d1c6; }
  #schedule { color: #f6d592; }
  #message:empty { display: none; }
  #message { color: #ffcfbc; padding: .85rem 1rem; background: #3a2824; border-radius: .65rem; }
  #rotation-panel { display: flex; flex-wrap: wrap; align-items: center; gap: .65rem 1.25rem; }
  #rotation-panel label { display: flex; align-items: center; gap: .5rem; }
  #rotation-panel input { width: 1.1rem; height: 1.1rem; accent-color: #f6d592; }
  #pick-rotation { width: auto; padding: 0 .85rem; }
  #rotation-status { margin: 0; font-variant-numeric: tabular-nums; }
  #outlets { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 1fr)); gap: 1rem; margin-top: 2rem; }
  article { border: 1px solid #426354; border-radius: 1rem; padding: 1.15rem; background: #172b23; }
  article[data-on="true"] { border-color: #b49a5d; }
  small { color: #c1d1c6; }
  button { width: 100%; min-height: 2.8rem; border: 1px solid #adc5b4; border-radius: .6rem; background: #243f33; color: inherit; font: inherit; cursor: pointer; }
  button[aria-pressed="true"] { background: #f6d592; color: #2e2516; border-color: #f6d592; }
  button:disabled { opacity: .62; cursor: default; }
  button:focus-visible { outline: 2px solid white; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>Christmas Lights</h1>
  <p id="schedule">Loading the light schedule…</p>
  <div id="rotation-panel">
    <label><input type="checkbox" id="rotation" disabled> Enable rotation</label>
    <button type="button" id="pick-rotation" disabled>Pick now</button>
    <p id="rotation-status"></p>
  </div>
  <p id="message" role="status"></p>
  <section id="outlets" aria-label="Light controls"></section>
</main>
<script>
const schedule = document.querySelector('#schedule');
const message = document.querySelector('#message');
const outlets = document.querySelector('#outlets');
const rotation = document.querySelector('#rotation');
const pickRotation = document.querySelector('#pick-rotation');
const rotationStatus = document.querySelector('#rotation-status');
const cards = new Map();
let rotationInfo = null;
let countdownEnds = null;
let refreshId = 0;
let refreshing = false;
let pending = false;
let commandError = '';

function renderCountdown() {
  if (!rotationInfo) return;
  if (countdownEnds === null) {
    rotationStatus.textContent = rotationInfo.enabled ? 'Enabled for tonight' : 'Off';
    return;
  }
  const seconds = Math.max(0, Math.ceil((countdownEnds - performance.now()) / 1000));
  const remaining = `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}`;
  const active = rotationInfo.active_lights
    .map(light => light.window ? `${light.name} (${light.window})` : light.name).join(', ');
  const label = active ? `${active} · Next rotation`
    : rotationInfo.manual ? 'Manual control · Rotation resumes' : 'Sunset defaults · Rotation starts';
  rotationStatus.textContent = `${label} in ${remaining}`;
}

function render(data) {
  rotationInfo = data.rotation;
  countdownEnds = rotationInfo.next_at === null ? null
    : performance.now() + (rotationInfo.next_at - rotationInfo.server_now) * 1000;
  rotation.checked = rotationInfo.enabled;
  rotation.disabled = pending || (!data.lights.length && !rotationInfo.enabled);
  pickRotation.disabled = pending || rotationInfo.next_at === null;
  renderCountdown();
  const next = data.next_time && new Intl.DateTimeFormat(undefined, {
    timeZone: data.timezone, weekday: 'short', hour: 'numeric', minute: '2-digit', timeZoneName: 'short'
  }).format(new Date(data.next_time));
  const phase = data.night ? 'Night schedule' : 'Daytime · manual lights turn off after 5 minutes';
  schedule.textContent = next ? `${phase} · Next ${data.next_event} ${next}` : phase;
  message.textContent = commandError || data.error || '';
  for (const light of data.lights) {
    if (!cards.has(light.id)) {
      const card = document.createElement('article');
      const label = document.createElement('small');
      const name = document.createElement('h2');
      const startup = document.createElement('p');
      const button = document.createElement('button');
      label.textContent = light.window || `Outlet ${light.port}`;
      name.textContent = light.name;
      startup.textContent = light.on_start ? 'Turns on at sunset' : 'Off at sunset';
      button.addEventListener('click', () => update(
        `/api/lights/${encodeURIComponent(light.id)}`, {on: card.dataset.on !== 'true'}
      ));
      card.append(label, name, startup, button);
      outlets.append(card);
      cards.set(light.id, {card, button});
    }
    const {card, button} = cards.get(light.id);
    card.dataset.on = light.on;
    button.textContent = light.on === null ? 'Unavailable' : light.on ? 'On' : 'Off';
    button.setAttribute('aria-pressed', String(light.on === true));
    button.setAttribute('aria-label', [light.name, light.window, 'power'].filter(Boolean).join(' '));
    button.disabled = pending || light.on === null;
  }
}

async function refresh() {
  if (pending || refreshing) return;
  refreshing = true;
  const id = refreshId;
  try {
    const response = await fetch('/api/status', {
      cache: 'no-store', signal: AbortSignal.timeout(10000)
    });
    if (!response.ok) throw new Error('Dashboard unavailable.');
    const data = await response.json();
    if (!pending && id === refreshId) render(data);
  } catch {
    if (pending || id !== refreshId) return;
    rotation.disabled = true;
    pickRotation.disabled = true;
    message.textContent = 'Dashboard unavailable. Reconnecting…';
    for (const {button} of cards.values()) button.disabled = true;
  } finally {
    refreshing = false;
  }
}

async function update(url, body) {
  if (pending) return;
  pending = true;
  refreshId++;
  rotation.disabled = true;
  pickRotation.disabled = true;
  commandError = '';
  for (const {button} of cards.values()) button.disabled = true;
  try {
    const response = await fetch(url, {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body),
      signal: AbortSignal.timeout(30000)
    });
    if (!response.ok) throw new Error(await response.text());
  } catch (error) {
    commandError = error.name === 'TimeoutError'
      ? 'The command timed out. Checking the current light state…' : error.message;
  } finally {
    pending = false;
    await refresh();
  }
}

rotation.addEventListener('change', () => update('/api/rotation', {enabled: rotation.checked}));
pickRotation.addEventListener('click', () => update('/api/rotation/pick', {}));
refresh();
setInterval(refresh, 3000);
setInterval(renderCountdown, 250);
</script>
</body>
</html>
